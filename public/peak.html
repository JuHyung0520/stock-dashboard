<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전고대비</title>
  <meta name="description" content="전고점 대비 낙폭과 회복에 필요한 상승률 — 하락률만 보면 안 보이는 비대칭">
  <meta name="theme-color" content="#0b0e14">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
  <!-- 테마 깜빡임 방지 — 그리기 전에 저장된 선택을 적용한다.
       nav.js 는 body 끝에서 돌아 이미 한 번 그려진 뒤라 늦다. -->
  <script>try{var t=localStorage.getItem('theme-v1');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chart.css">
  <link rel="stylesheet" href="peak.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⛰️</span>
      <h1>전고대비</h1>
      <span class="brand-sub">낙폭과 회복 필요 상승률</span>
    </div>
    <div class="nav-links" data-nav></div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="lastUpdated">불러오는 중…</span>
    </div>
  </header>

  <section class="panel controls">
    <div class="ctl-group">
      <span class="ctl-label">기준 기간</span>
      <div class="tabs" id="rangeTabs">
        <button class="tab" data-range="1Y">1년</button>
        <button class="tab active" data-range="3Y">3년</button>
        <button class="tab" data-range="5Y">5년</button>
        <button class="tab" data-range="10Y">10년</button>
        <button class="tab" data-range="ALL">상장 이후</button>
      </div>
    </div>
    <div class="ctl-group">
      <div class="searchbox compact">
        <input type="text" id="searchInput" placeholder="종목 추가 (국내만)" autocomplete="off" spellcheck="false">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <button class="ghost-btn" id="resetBtn" title="기본 목록으로 되돌리기">초기화</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>낙폭 순위</h2>
      <span class="panel-note" id="summaryNote">전고점은 장중 고가 기준</span>
    </div>
    <div class="peak-list" id="peakList">
      <div class="skel" style="height:74px;margin-bottom:8px"></div>
      <div class="skel" style="height:74px;margin-bottom:8px"></div>
      <div class="skel" style="height:74px;margin-bottom:8px"></div>
      <div class="skel" style="height:74px"></div>
    </div>
  </section>

  <section class="panel chart-panel" id="detailPanel" hidden>
    <div class="panel-head">
      <h2 id="detailTitle">종목</h2>
      <span class="panel-note" id="detailNote"></span>
    </div>
    <div class="chart-box" id="detailChart"></div>
    <p class="chart-note" id="detailFoot"></p>
  </section>

  <script src="nav.js"></script>
  <script src="chart.js"></script>
  <script src="peak.js"></script>
</body>
</html>
